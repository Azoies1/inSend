services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rtr
      # Local throwaway database only. Holds synthetic data, bound to loopback.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtr_local_dev}
      POSTGRES_DB: rtr_sandbox
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rtr -d rtr_sandbox']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
